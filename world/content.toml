# Veltrona, United States
[[block]]
id = "VEL-US-DOSE"
product = "VEL"
country = "US"
topic = "dosing"
population = "adult"
version = 4
status = "approved"
approved_on = "2026-03-02"
expires_on = "2027-03-01"
mlr_ref = "MLR-2026-0102"
source = "Synthetic prescribing information, section 2.1"
text = "The recommended dose of Veltrona is 15 mg taken orally once daily. No titration is required when starting treatment."

[[block]]
id = "VEL-US-PED"
product = "VEL"
country = "US"
topic = "dosing"
population = "adolescent"
version = 1
status = "approved"
approved_on = "2026-05-18"
expires_on = "2027-05-17"
mlr_ref = "MLR-2026-0204"
source = "Synthetic prescribing information, section 2.2"
text = "In adolescents aged 12 years and older who weigh at least 40 kg, the recommended dose of Veltrona is 15 mg once daily."

[[block]]
id = "VEL-US-ADMIN"
product = "VEL"
country = "US"
topic = "administration"
version = 2
status = "approved"
approved_on = "2026-03-02"
expires_on = "2027-03-01"
mlr_ref = "MLR-2026-0103"
source = "Synthetic prescribing information, section 2.3"
text = "Veltrona tablets can be taken with or without food. Tablets should be swallowed whole and not crushed or split."

[[block]]
id = "VEL-US-MISS"
product = "VEL"
country = "US"
topic = "missed_dose"
version = 2
status = "approved"
approved_on = "2026-03-02"
expires_on = "2027-03-01"
mlr_ref = "MLR-2026-0104"
source = "Synthetic prescribing information, section 2.4"
text = "If a dose is missed by less than 12 hours, it should be taken as soon as possible. If more than 12 hours have passed, the missed dose should be skipped and the next dose taken at the usual time."

[[block]]
id = "VEL-US-STOR"
product = "VEL"
country = "US"
topic = "storage"
version = 3
status = "approved"
approved_on = "2026-03-02"
expires_on = "2027-03-01"
mlr_ref = "MLR-2026-0105"
source = "Synthetic prescribing information, section 16"
text = "Store Veltrona at 20°C to 25°C in the original blister to protect it from moisture."

[[block]]
id = "VEL-US-RENAL"
product = "VEL"
country = "US"
topic = "renal_impairment"
version = 2
status = "approved"
approved_on = "2026-03-02"
expires_on = "2027-03-01"
mlr_ref = "MLR-2026-0106"
source = "Synthetic prescribing information, section 8.6"
text = "No dose adjustment of Veltrona is needed in mild or moderate renal impairment. Veltrona has not been studied in severe renal impairment and is not recommended in that population."

[[block]]
id = "VEL-US-PREG"
product = "VEL"
country = "US"
topic = "pregnancy"
version = 2
status = "approved"
approved_on = "2026-03-02"
expires_on = "2027-03-01"
mlr_ref = "MLR-2026-0107"
source = "Synthetic prescribing information, section 8.1"
text = "There are no adequate data on the use of Veltrona in pregnant women. Women who can become pregnant should use effective contraception during treatment and for 4 weeks after the last dose."

[[block]]
id = "VEL-US-INTER"
product = "VEL"
country = "US"
topic = "interactions"
version = 3
status = "approved"
approved_on = "2026-03-02"
expires_on = "2027-03-01"
mlr_ref = "MLR-2026-0108"
source = "Synthetic prescribing information, section 7"
text = "Strong CYP3A4 inhibitors increase zelocitinib exposure. Reduce the Veltrona dose to 7.5 mg once daily when it is given with a strong CYP3A4 inhibitor."

[[block]]
id = "ISI-VEL-US"
product = "VEL"
country = "US"
topic = "safety_information"
version = 3
status = "approved"
approved_on = "2026-03-02"
expires_on = "2027-03-01"
mlr_ref = "MLR-2026-0101"
source = "Synthetic prescribing information, boxed warning summary"
text = "Important safety information: Veltrona may increase the risk of serious infections. Monitor patients for signs of infection during treatment. See the full prescribing information for all warnings and precautions."


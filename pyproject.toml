[project]
name = "hcpagents"
version = "0.1.0"
description = "Agentic AI Buildcamp project 1, a regulated AI inquiry workflow: agents on Claude Haiku 5.5, local AWS on Floci"
readme = "README.md"
authors = [
    { name = "Param Harrison", email = "param@learnwithparam.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3==1.43.106",
    "claude-agent-sdk==0.2.163",
    "fastapi==0.142.2",
    "fastembed==0.9.0",
    "langgraph==1.2.15",
    "temporalio==1.34.0",
    "psycopg[binary]==3.3.6",
    "pyjwt[crypto]==2.15.1",
    "cryptography==50.0.2",  # AES-GCM for sealed ledger data; already in the lock through pyjwt
    "uvicorn==0.54.0",
    "valkey==6.2.0",  # Valkey client for the retrieval cache; released 2026-10-12
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "mcp==1.30.0",
    "typer==0.27.2",
    "httpx==0.28.1",  # the gateway and the hcp CLI call HTTP at runtime
]

[project.scripts]
hcp = "hcpagents.cli:app"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
deploy = [
    "aws-cdk-lib==2.273.0",
    "cdk-nag==3.0.2",
    "constructs==10.8.1",
]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
default-groups = ["dev", "deploy"]

[tool.pytest.ini_options]
pythonpath = ["deploy"]
testpaths = ["tests", "labs"]
markers = ["floci: needs Floci running on localhost:4566"]

[project]
name = "hcpagents"
version = "0.1.0"
description = "Agentic AI Buildcamp project 1, a regulated AI inquiry workflow: agents on Claude Haiku 5.5, local AWS on Floci"
readme = "README.md"
authors = [
    { name = "Param Harrison", email = "param@learnwithparam.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3==1.43.106",
    "claude-agent-sdk==0.2.163",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "labs"]
markers = ["floci: needs Floci running on localhost:4566"]

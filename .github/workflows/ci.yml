name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"  # nightly, so a new advisory on a pinned dependency shows up without a push

permissions:
  contents: read

jobs:
  check:
    # The gate: tests, evals, mutants, prose, web build, diagrams, and a clean cdk-nag synth (tests/test_deploy.py).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: make check

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks reads the whole history
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Secret scan: the repo is public and the Anthropic key lives in a local .env.
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --redact --exit-code 1

      # Dependency audit: known advisories against the exact locked versions.
      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.lock.txt
          uvx pip-audit==2.10.1 -r requirements.lock.txt --no-deps --disable-pip

      # SBOM: what shipped, as CycloneDX, kept as a build artifact.
      - name: SBOM (CycloneDX)
        run: |
          uv sync --frozen --no-dev --no-group deploy
          uvx --from cyclonedx-bom==7.5.0 cyclonedx-py environment .venv --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

      # SAST: CodeQL on the Python source.
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
